steps:
  # 1. Build Docker image from backend/Dockerfile
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/inventory-images/inventory-api:$COMMIT_SHA"
      - "./backend"

  # 2. Push image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/inventory-images/inventory-api:$COMMIT_SHA"

  # 3. Deploy image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "inventory-api"
      - "--image"
      - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/inventory-images/inventory-api:$COMMIT_SHA"
      - "--region"
      - "asia-southeast1"
      - "--quiet"

images:
  - "asia-southeast1-docker.pkg.dev/$PROJECT_ID/inventory-images/inventory-api:$COMMIT_SHA"